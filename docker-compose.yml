services:
  cqa:
    build: .
    ports:
      - "127.0.0.1:8787:8787"  # no auth: keep it on this machine
    env_file:
      - path: .env
        required: false
    volumes:
      - cqa-store:/app/data/store
      # optional: call audio for playback
      # - ./data/audio:/app/data/audio:ro
volumes:
  cqa-store:
