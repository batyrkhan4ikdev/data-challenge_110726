[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cqa"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "litestar[standard]",
    "pydantic==2.14.3",  # CI diffs the generated types byte for byte
    "niquests",
    "certifi",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "jsonschema"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
