<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Контроль качества диалогов</title>
    <link rel="stylesheet" href="./standalone.css" />
    <link rel="stylesheet" href="./cqa.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- web/dist is build output (gitignored): a fresh clone must say how to build instead of showing a blank page. -->
    <script type="module">
      const root = document.getElementById('app');
      import('./dist/main.js').then(
        ({ mountCqa }) => mountCqa(root, { apiBase: '/api' }),
        () => {
          root.innerHTML = '<p style="font:16px system-ui;padding:24px">Интерфейс не собран. Выполните <code>npm ci --prefix web &amp;&amp; npm run build --prefix web</code> и обновите страницу.</p>';
        },
      );
    </script>
  </body>
</html>
