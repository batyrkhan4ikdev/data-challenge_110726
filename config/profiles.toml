model = "openai-codex/gpt-6-luna"
supports_n = false
structured = "prompt"
max_concurrency = 8
max_tokens = 4096
cost = { kind = "tokens", usd_per_mtok_in = 0.10, usd_per_mtok_out = 0.50 }
hosting = "external_api"

