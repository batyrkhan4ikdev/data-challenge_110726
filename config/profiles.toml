max_tokens = 4096
extra_body = {}
cost = { kind = "gpu", usd_per_hour = 5.35, concurrency = 32 }

# $5.35/GPU-h = median on-demand H200 price (Vast, RunPod, Nebius, CoreWeave; 2026-11), see docs/research/llm-candidates.md.
# cost.concurrency is a placeholder equal to max_concurrency until benchmark phase 1 measures throughput.

# Paid / cloud models via the aigw gateway (OpenAI-compatible /v1). aigw drops response_format for
# Claude and GPT, so those use structured = "prompt" (schema in the prompt, parser validates).
[profiles.aigw-sonnet]
provider = "openai"
base_url_env = "AIGW_BASE_URL"
api_key_env = "AIGW_API_KEY"
model = "anthropic/claude-sonnet-5-5"
supports_n = false
structured = "prompt"
max_concurrency = 8
max_tokens = 4096
cost = { kind = "tokens", usd_per_mtok_in = 2.0, usd_per_mtok_out = 10.0 }
hosting = "external_api"

[profiles.aigw-luna]
provider = "openai"
