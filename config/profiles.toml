[profiles.fake]
provider = "fake"

[profiles.h200-gemma]
provider = "openai"
base_url_env = "H200_GEMMA_BASE_URL"
api_key_env = "H200_API_KEY"
model = "gemma-4:31b"
supports_n = true
structured = "json_schema"
max_concurrency = 32  # hk-gemma runs 4 replicas until 17:00 Nov 8
max_tokens = 4096
extra_body = {}
cost = { kind = "gpu", usd_per_hour = 5.35, concurrency = 16 }

