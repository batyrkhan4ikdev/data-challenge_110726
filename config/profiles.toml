# Per-criterion vote of three judges (majority; scales take the median; gemma breaks ties and leads the evidence).
# On the 65-dialog gold: 0.940 against 0.910–0.930 for gemma alone, stable across gemma runs.
[profiles.ensemble]
provider = "ensemble"
members = ["h200-gemma:per_criterion", "alem-qwen27b:single", "aigw-flashnext:single"]
