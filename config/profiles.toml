# Per-criterion vote of three judges (majority; scales take the median; gemma breaks ties and leads the evidence).
# Same accuracy as gemma alone on the 65-dialog gold (0.928 vs 0.929, see docs/internal/research/benchmark-phase1.md),
# lower total error (MAE 4.55 vs 4.91); kept as an option, not the control default.
[profiles.ensemble]
provider = "ensemble"
members = ["h200-gemma:per_criterion", "alem-qwen27b:single", "aigw-flashnext:single"]
