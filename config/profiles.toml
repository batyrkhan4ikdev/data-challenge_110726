[profiles.fake]
provider = "fake"

[profiles.h200-gemma]
provider = "openai"
base_url_env = "H200_GEMMA_BASE_URL"
api_key_env = "H200_API_KEY"
model = "gemma-4:31b"
supports_n = true
structured = "json_schema"
max_concurrency = 16
max_tokens = 4096
extra_body = {}
cost = { kind = "gpu", usd_per_hour = 0.0, concurrency = 16 }

[profiles.h200-gptoss]
provider = "openai"
base_url_env = "H200_GPTOSS_BASE_URL"
api_key_env = "H200_API_KEY"
model = "gpt-oss:120b"
supports_n = true
structured = "json_schema"
max_concurrency = 48
max_tokens = 4096
extra_body = { reasoning_effort = "low" }
cost = { kind = "gpu", usd_per_hour = 0.0, concurrency = 48 }

[profiles.h200-kz]
provider = "openai"
base_url_env = "H200_KZ_BASE_URL"
api_key_env = "H200_API_KEY"
model = "qwen3.5-35b-a3b-kazakh"
supports_n = true
structured = "json_schema"
max_concurrency = 48
max_tokens = 4096
extra_body = {}  # do NOT send reasoning_effort: it turns thinking on
cost = { kind = "gpu", usd_per_hour = 0.0, concurrency = 48 }
